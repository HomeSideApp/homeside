name: CI

# Mandatory gates for the registration, authentication and approval work.
#
# The PHP suite and the CRITICAL browser scenarios run on every pull request,
# because a change that silently reopens a registration or bootstrap bypass must
# never reach review. The full matrix (Firefox, the SaaS install, concurrency and
# the long E2E set) is scheduled rather than per-push, so contributors get fast
# signal without losing the deep coverage.
#
# UNVERIFIED: this workflow has not been executed on a runner. It is written from
# the commands that were verified locally. Treat the first run as the real test.

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_DEBUG: 'false'
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_DATABASE: testing
  DB_USERNAME: root
  DB_PASSWORD: root
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  MAIL_MAILER: smtp
  MAIL_HOST: 127.0.0.1
  MAIL_PORT: '1025'
  REGISTRATION_BLOCK_KEY: ci-only-registration-block-key-not-a-deployment-secret

jobs:
  php:
    name: PHP tests, formatting and static analysis
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip, pcntl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan migrate --force
      - name: PHP test suite
        run: php artisan test --compact
      - name: Formatting (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G
        continue-on-error: true # pre-existing findings; tighten once the baseline is clean

  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Typecheck
        run: npm run types:check
        continue-on-error: true # pre-existing vue-tsc errors outside this work

  e2e-critical:
    name: Critical browser scenarios (Chromium)
    runs-on: ubuntu-latest
    needs: [php, frontend]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Mailpit captures the real messages the flows depend on. It is the same
      # image the local stack uses, so the assertions and the environment match.
      - name: Start Mailpit
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Seed the isolated E2E database
        env:
          APP_ENV: e2e
          DB_DATABASE: testing_e2e
        run: php artisan e2e:seed
      - name: Critical browser scenarios
        run: npx playwright test --project=chromium --grep @critical
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Artifacts contain cookies and one-time auth URLs. Retention is short
          # and access is limited to the repository.
          retention-days: 7
          path: |
            playwright-report/
            test-results/

  e2e-full:
    name: Full browser matrix (scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Start Mailpit
        run: docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox
      - name: Seed the isolated E2E database
        env:
          APP_ENV: e2e
          DB_DATABASE: testing_e2e
        run: php artisan e2e:seed
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-full
          retention-days: 7
          path: |
            playwright-report/
            test-results/
