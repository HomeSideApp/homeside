name: CI

# Mandatory gates for the registration, authentication and approval work.
#
# The PHP suite and the CRITICAL browser scenarios run on every pull request and
# on every push to `develop`, because a change that silently reopens a
# registration or bootstrap bypass must never reach review — and `develop` is the
# branch that deployments consume, so it cannot be the branch nobody tests. The
# full browser matrix (Firefox and the long E2E set) stays scheduled rather than
# per-push, so contributors get fast signal without losing the deep coverage.
#
# UNVERIFIED: this workflow has not been executed on a runner. It is written from
# the commands that were verified locally. Treat the first run as the real test.
#
# OSS-ONLY: `homeside/saas` is an optional Composer suggestion, not a requirement
# (composer.json), so `composer install` succeeds on a fresh clone with no sibling
# checkout. Commercial coverage runs in the package and deployment repositories,
# so this public workflow only gates the OSS surface.
#
# Assets: there is no `public/build` in the repository (it is gitignored), and
# the Inertia pages render `@vite`. The PHP job builds the frontend before the
# test suite, and the browser jobs build it before starting the server, so a
# fresh checkout has a manifest.

on:
  pull_request:
  push:
    branches: [main, master, develop]
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_ENV: testing
  APP_DEBUG: 'false'
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: '3306'
  DB_DATABASE: testing
  DB_USERNAME: root
  DB_PASSWORD: root
  CACHE_STORE: array
  SESSION_DRIVER: array
  QUEUE_CONNECTION: sync
  MAIL_MAILER: smtp
  MAIL_HOST: 127.0.0.1
  MAIL_PORT: '1025'
  # The Playwright fixtures read Mailpit over its HTTP API. The app talks SMTP to
  # 127.0.0.1:1025; the fixtures need 8025 on the same host (the default
  # `http://mailpit:8025` only resolves inside the Sail network).
  E2E_MAILPIT_URL: http://127.0.0.1:8025
  REGISTRATION_BLOCK_KEY: ci-only-registration-block-key-not-a-deployment-secret

jobs:
  php:
    name: PHP tests, formatting and static analysis
    runs-on: ubuntu-latest
    # The suite must not need a mail server: phpunit.xml asks for the `array`
    # transport, but PHPUnit does not overwrite an environment variable that is
    # already set, so this workflow's SMTP settings used to win and every test
    # that notifies someone died on a refused connection to 127.0.0.1:1025.
    # The browser jobs are the ones that talk to Mailpit, and they start it.
    env:
      MAIL_MAILER: array
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping" --health-interval=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip, pcntl
          coverage: none
      - uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # No `public/build` in a fresh checkout and the suite renders @vite.
      - run: npm ci
      - run: npm run build
      - run: php artisan migrate --force
      - name: PHP test suite
        run: php artisan test --compact
      - name: Formatting (Pint)
        run: vendor/bin/pint --test
      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G

  frontend:
    name: Frontend build and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `npm run build` runs the Wayfinder Vite plugin, which shells out to
      # `php artisan wayfinder:generate`, so this job needs PHP and the
      # Composer dependencies too.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip, pcntl
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Typecheck
        run: npm run types:check
        continue-on-error: true # 26 pre-existing vue-tsc errors outside this work

  e2e-critical:
    name: Critical browser scenarios (Chromium)
    runs-on: ubuntu-latest
    needs: [php, frontend]
    env:
      APP_ENV: e2e
      DB_DATABASE: testing_e2e
      SESSION_DRIVER: file
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:alpine
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # Mailpit captures the real messages the flows depend on. It is the same
      # image the local stack uses, so the assertions and the environment match.
      - name: Start Mailpit
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      # The isolated server serves the real Inertia pages, so it needs the
      # manifest a fresh checkout does not have.
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Seed the isolated E2E database
        run: php artisan e2e:seed
      - name: Critical browser scenarios
        run: npx playwright test --project=chromium --grep @critical
      - name: Upload report and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # Artifacts contain cookies and one-time auth URLs. Retention is short
          # and access is limited to the repository.
          retention-days: 7
          if-no-files-found: ignore
          path: |
            tests/e2e/.artifacts/html-report/
            tests/e2e/.artifacts/test-results/
            tests/e2e/.artifacts/junit.xml

  e2e-full:
    name: Full browser matrix (scheduled)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      APP_ENV: e2e
      DB_DATABASE: testing_e2e
      SESSION_DRIVER: file
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing_e2e
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_mysql, bcmath, gd, intl, zip, pcntl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Start Mailpit
        run: docker run -d --name mailpit -p 1025:1025 -p 8025:8025 axllent/mailpit:latest
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: npm ci
      - run: npm run build
      # Both configured projects run here: Chromium and Firefox.
      - run: npx playwright install --with-deps chromium firefox
      - name: Seed the isolated E2E database
        run: php artisan e2e:seed
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-full
          retention-days: 7
          if-no-files-found: ignore
          path: |
            tests/e2e/.artifacts/html-report/
            tests/e2e/.artifacts/test-results/
            tests/e2e/.artifacts/junit.xml

  # Commercial coverage runs in the package/deployment repositories, so this
  # public workflow stays OSS-only.
